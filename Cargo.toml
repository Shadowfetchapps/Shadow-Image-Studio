[package]
name = "shadow-image-studio"
version = "1.0.0"
edition = "2021"
description = "A fast lightweight image editor for Linux"
license = "MIT"
repository = "https://github.com/ShadowfetchLinux/Shadow-Image-Studio"
homepage = "https://github.com/ShadowfetchLinux/Shadow-Image-Studio"
authors = ["Shadow Image Studio contributors"]
readme = "README.md"
default-run = "shadow-image-studio"

[lib]
name = "shadow_image_studio"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "shadow-image-studio"
path = "src/main.rs"

[dependencies]
gtk = { version = "0.9", package = "gtk4", features = ["v4_14"] }
adw = { version = "0.7", package = "libadwaita", features = ["v1_5"] }
glib = "0.20"
gio = "0.20"
gdk-pixbuf = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
thiserror = "2"
which = "7"
open = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff", "bmp", "gif"] }
kamadak-exif = "0.6"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
